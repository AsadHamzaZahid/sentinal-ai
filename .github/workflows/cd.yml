name: SentinelAI CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/sentinelai-demo:latest
            ghcr.io/${{ steps.owner.outputs.name }}/sentinelai-demo:${{ github.sha }}

      - name: Build and publish live image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.live
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/sentinelai-live:latest
            ghcr.io/${{ steps.owner.outputs.name }}/sentinelai-live:${{ github.sha }}
